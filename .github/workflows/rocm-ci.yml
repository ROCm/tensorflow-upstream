name: TF theRock CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop-upstream
      - r2.21-rocm-enhanced
      - r2.20-rocm-enhanced
  workflow_call:
    inputs:
      runner_label:
        description: 'Runner label for GPU jobs'
        required: false
        default: 'linux-tensorflow-mi250-4'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: TF ROCm build and test
    runs-on: ${{ inputs.runner_label || 'linux-tensorflow-mi250-4' }}
    env:
      PIP_NO_CACHE_DIR: 1
    defaults:
      run:
        shell: bash
    container:
      # tensorflow-2.22.0-ubuntu24.04-py3.12-prereleases-device-all-rocm10.0.0rc4-f8d427e
      image: rocm/ufb-private@sha256:8cc5172f2ea41c80988b775252d1f7ab2a3665a422edcccb07490d69860837be
    timeout-minutes: 480
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Test Single GPU
        env:
          TFCI: 'py312,linux_x86_rocm,no_docker'
          TF_ANY_SCRIPT: 'tensorflow/tools/ci_build/linux/rocm/run_gpu_single.sh'
          TFCI_GITHUB_ACTIONS: true
        run: ./ci/official/any.sh

      - name: Test Multi GPU
        env:
          TFCI: 'py312,linux_x86_rocm,no_docker'
          TF_ANY_SCRIPT: 'tensorflow/tools/ci_build/linux/rocm/run_gpu_multi.sh'
          TFCI_GITHUB_ACTIONS: true
        run: ./ci/official/any.sh

      - name: Test XLA
        env:
          TFCI: 'py312,linux_x86_rocm,no_docker'
          TF_ANY_SCRIPT: 'tensorflow/tools/ci_build/linux/rocm/run_xla.sh'
          TFCI_GITHUB_ACTIONS: true
        run: ./ci/official/any.sh
