name: TF theRock CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - r2.20-rocm-enhanced
  workflow_call:
    inputs:
      runner_label:
        description: 'Runner label for GPU jobs'
        required: false
        default: 'linux-tensorflow-mi250-4'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: TF ROCm build and test
    runs-on: ${{ inputs.runner_label || 'linux-tensorflow-mi250-4' }}
    env:
      PIP_NO_CACHE_DIR: 1
    defaults:
      run:
        shell: bash
    container:
      # rocm/ufb-private:rocm10.0-py3.12-tf2.22-ubuntu22.04-dev
      image: rocm/ufb-private@sha256:7ab50c72e4d3703661c64f6e3cf72c627713d5bc779aa20381a638c6a1e35b03
    timeout-minutes: 960
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_PARAMETERS: "'checkout.workers=12' 'core.featureManyFiles=true'"
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Test CPU
        run: ./tensorflow/tools/ci_build/linux/rocm/run_cpu.sh

      - name: Test Single GPU
        run: ./tensorflow/tools/ci_build/linux/rocm/run_gpu_single.sh

      - name: Test Multi GPU
        run: ./tensorflow/tools/ci_build/linux/rocm/run_gpu_multi.sh

      - name: Test XLA
        run: ./tensorflow/tools/ci_build/linux/rocm/run_xla.sh
