#
# Per-PR TF ROCm CI against the pinned stable theRock release.
#
# The pipeline itself lives in .github/workflows/rocm-ci-reusable.yml, shared
# with .github/workflows/rocm-ci-weekly.yml.
#
name: TF theRock CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop-upstream
      - r2.21-rocm-enhanced
      - r2.20-rocm-enhanced
  workflow_call:
    inputs:
      runner_label:
        description: 'Runner label for GPU jobs'
        required: false
        default: 'linux-tensorflow-mi250-4'
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: therock_release_10.1
    uses: ./.github/workflows/rocm-ci-reusable.yml
    permissions:
      contents: read
      packages: read
    with:
      mode_name: therock_release_10.1
      runner_label: ${{ inputs.runner_label || 'linux-tensorflow-mi250-4' }}
      rocm_tarball: 'https://stable.repo.amd.com/rocm/core/tarball/therock-dist-linux-multiarch-10.1.0.tar.gz'
      rocm_tarball_hash: 'a95c72f0052168f2262365dff71c2259331721ad0a65da7957dc7d96ccb77021'
